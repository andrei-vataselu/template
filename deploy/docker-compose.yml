services:
  db:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m

  gateway:
    build: ./gateway
    ports:
      - "80:8080"
    environment:
      ORIGIN_HEADER_VALUE: ${ORIGIN_HEADER_VALUE:-local-dev-secret}
      SKIP_ORIGIN_CHECK: ${SKIP_ORIGIN_CHECK:-1}
    depends_on:
      - api
      - web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

  api:
    build: ../apps/backend
    environment:
      PORT: "3000"
      APP_ENV: ${APP_ENV:-dev}
      APP_NAME: ${APP_NAME:-template}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-0}
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      BOOTSTRAP_ADMIN_SUBS: ${BOOTSTRAP_ADMIN_SUBS:-}
      AWS_REGION: ${COGNITO_REGION:-${AWS_REGION:-eu-west-1}}
    expose:
      - "3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    pids_limit: 200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../apps/frontend
      args:
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION:-${COGNITO_REGION:-}}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:-${COGNITO_USER_POOL_ID:-}}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-${COGNITO_CLIENT_ID:-}}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-${COGNITO_DOMAIN:-}}
    expose:
      - "8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

volumes:
  pgdata:

networks:
  default:
    name: template_net
