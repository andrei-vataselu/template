name: AWS stop billing leftovers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly stop-billing to proceed"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  reject:
    if: inputs.confirm != 'stop-billing'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Must confirm with stop-billing" && exit 1

  stop-billing:
    if: inputs.confirm == 'stop-billing'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Disable GuardDuty
        run: |
          set -euo pipefail
          for region in eu-west-1 us-east-1; do
            ids=$(aws guardduty list-detectors --region "$region" --query 'DetectorIds[]' --output text 2>/dev/null || true)
            for id in $ids; do
              if [ -n "$id" ] && [ "$id" != "None" ]; then
                echo "Deleting GuardDuty $id ($region)"
                aws guardduty delete-detector --region "$region" --detector-id "$id"
              fi
            done
          done

      - name: Delete CloudTrail and bucket
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TRAIL_BUCKET="popo-cloudtrail-${ACCOUNT}"
          if aws cloudtrail get-trail --name popo-management >/dev/null 2>&1; then
            aws cloudtrail stop-logging --name popo-management || true
            aws cloudtrail delete-trail --name popo-management
          fi
          if aws s3api head-bucket --bucket "$TRAIL_BUCKET" 2>/dev/null; then
            aws s3 rm "s3://${TRAIL_BUCKET}" --recursive || true
            python3 - <<'PY'
          import json, subprocess, os
          bucket = f"popo-cloudtrail-{os.environ['ACCOUNT']}"
          raw = subprocess.check_output(["aws","s3api","list-object-versions","--bucket",bucket,"--output","json"])
          data = json.loads(raw)
          objs = [{"Key": o["Key"], "VersionId": o["VersionId"]} for o in data.get("Versions", []) + data.get("DeleteMarkers", [])]
          for i in range(0, len(objs), 1000):
              chunk = objs[i:i+1000]
              if not chunk:
                  continue
              body = json.dumps({"Objects": chunk, "Quiet": True})
              subprocess.check_call(["aws","s3api","delete-objects","--bucket",bucket,"--delete",body])
          PY
            aws s3api delete-bucket --bucket "$TRAIL_BUCKET"
          fi

      - name: Delete Route53 hosted zone
        run: |
          set -euo pipefail
          zraw=$(aws route53 list-hosted-zones --query 'HostedZones[?Name==`andrei-vataselu.online.`].Id' --output text)
          if [ -z "$zraw" ] || [ "$zraw" = "None" ]; then
            echo "No hosted zone"
            exit 0
          fi
          zid="${zraw##*/}"
          aws route53 list-resource-record-sets --hosted-zone-id "$zid" --output json > /tmp/rrs.json
          python3 - <<PY
          import json, subprocess
          zid = "${zid}"
          rrs = json.load(open("/tmp/rrs.json"))["ResourceRecordSets"]
          changes = [{"Action":"DELETE","ResourceRecordSet": r} for r in rrs if r["Type"] not in ("NS","SOA")]
          if changes:
              body = json.dumps({"Changes": changes})
              subprocess.check_call(["aws","route53","change-resource-record-sets","--hosted-zone-id",zid,"--change-batch",body])
          print("deleting", zid)
          PY
          aws route53 delete-hosted-zone --id "$zid"

      - name: Patch global TF state
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY=global/terraform.tfstate
          BUCKET="popo-tfstate-${ACCOUNT}"
          aws s3 cp "s3://${BUCKET}/${KEY}" /tmp/global.tfstate
          python3 - <<'PY'
          import json
          path = "/tmp/global.tfstate"
          with open(path) as f:
              state = json.load(f)
          keep = []
          for r in state.get("resources", []):
              typ = r.get("type", "")
              name = r.get("name", "")
              if typ in ("aws_route53_zone", "aws_cloudtrail", "aws_guardduty_detector"):
                  continue
              if typ.startswith("aws_s3_") and name.startswith("cloudtrail"):
                  continue
              keep.append(r)
          state["resources"] = keep
          state["serial"] = int(state.get("serial", 0)) + 1
          with open(path, "w") as f:
              json.dump(state, f)
          print("kept", len(keep))
          PY
          aws s3 cp /tmp/global.tfstate "s3://${BUCKET}/${KEY}"

      - name: Verify
        run: |
          set -euo pipefail
          echo "GuardDuty:" $(aws guardduty list-detectors --query 'DetectorIds' --output text)
          echo "CloudTrail:" $(aws cloudtrail describe-trails --query 'trailList[].Name' --output text)
          echo "Route53:" $(aws route53 list-hosted-zones --query 'HostedZones[].Name' --output text)
          echo "S3:" $(aws s3api list-buckets --query 'Buckets[].Name' --output text)
