name: Fetch API logs

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Tail app / gateway logs
        run: |
          set -euo pipefail
          echo "=== Log groups ==="
          aws logs describe-log-groups --log-group-name-prefix /popo/dev --query 'logGroups[].logGroupName' --output text
          aws logs describe-log-groups --query 'logGroups[?contains(logGroupName, `popo`) || contains(logGroupName, `dev`)].logGroupName' --output text
          START=$(($(date +%s)*1000 - 3600000))
          for g in /popo/dev/app /popo/dev/gateway /popo/dev/web; do
            echo "=== $g ==="
            aws logs filter-log-events --log-group-name "$g" --start-time "$START" --filter-pattern '?error ?Error ?ERROR ?/me ?Internal ?identity ?postgres ?fail' --limit 50 --query 'events[].message' --output text 2>/dev/null || echo "(missing or empty)"
          done
          echo "=== recent app any ==="
          aws logs tail /popo/dev/app --since 30m --format short 2>/dev/null | tail -n 80 || true
          echo "=== ASG instances + SSM ==="
          INST=$(aws ec2 describe-instances --filters Name=tag:Name,Values=popo-dev-app Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "instance=$INST"
          if [ -n "$INST" ] && [ "$INST" != "None" ]; then
            CMD=$(aws ssm send-command --instance-ids "$INST" --document-name AWS-RunShellScript --parameters 'commands=["docker ps --format {{.Names}}","docker logs --tail 120 $(docker ps -q --filter name=api 2>/dev/null | head -1) 2>&1 || docker logs --tail 120 $(docker ps -q | head -1) 2>&1"]' --query 'Command.CommandId' --output text)
            sleep 8
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INST" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          fi
