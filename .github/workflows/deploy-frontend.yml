name: Deploy frontend

# Auto on main (dev) when frontend changes; manual for any env
on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/scripts/asg-roll.sh"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (manual only; push to main always deploys dev)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: popo

jobs:
  deploy:
    name: frontend → ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        working-directory: apps/frontend
        run: docker build -t popo-frontend:${{ github.sha }} .

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll ASG (zero-downtime refresh)
        run: |
          chmod +x .github/scripts/asg-roll.sh
          .github/scripts/asg-roll.sh \
            "${{ env.PROJECT_NAME }}-${{ steps.env.outputs.name }}-app" \
            "${{ env.AWS_REGION }}" \
            "${{ env.PROJECT_NAME }}-${{ steps.env.outputs.name }}-app"
