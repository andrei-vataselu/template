name: Deploy frontend

# Auto on main (dev) when frontend changes; manual for any env
on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (manual only; push to main always deploys dev)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: popo

jobs:
  deploy:
    name: frontend → ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        working-directory: apps/frontend
        run: docker build -t popo-frontend:${{ github.sha }} .

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll ASG (zero-downtime refresh)
        run: |
          set -euo pipefail
          ASG="${{ env.PROJECT_NAME }}-${{ steps.env.outputs.name }}-app"
          echo "Target ASG=$ASG"

          # Latest commit wins — cancel any in-progress refresh (FE+BE can race on main)
          CUR=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG" \
            --region "${{ env.AWS_REGION }}" \
            --max-records 1 \
            --query 'InstanceRefreshes[0].Status' --output text 2>/dev/null || echo "None")
          if [ "$CUR" = "InProgress" ] || [ "$CUR" = "Pending" ] || [ "$CUR" = "Cancelling" ]; then
            echo "Cancelling existing refresh (status=$CUR)..."
            aws autoscaling cancel-instance-refresh \
              --auto-scaling-group-name "$ASG" \
              --region "${{ env.AWS_REGION }}" || true
            for i in $(seq 1 36); do
              S=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG" \
                --region "${{ env.AWS_REGION }}" \
                --max-records 1 \
                --query 'InstanceRefreshes[0].Status' --output text)
              echo "  wait $i: $S"
              case "$S" in
                Cancelled|Failed|Successful|None) break ;;
              esac
              sleep 10
            done
          fi

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG" \
            --region "${{ env.AWS_REGION }}" \
            --preferences MinHealthyPercentage=100,InstanceWarmup=600,SkipMatching=false \
            --query InstanceRefreshId --output text)
          echo "InstanceRefreshId=$REFRESH_ID"
