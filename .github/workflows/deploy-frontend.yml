name: Deploy frontend

# Manual — build frontend image, then roll ASG (instances git-pull + compose rebuild)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: popo

jobs:
  deploy:
    name: frontend → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        working-directory: apps/frontend
        run: docker build -t popo-frontend:${{ github.sha }} .

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll ASG (zero-downtime refresh)
        run: |
          ASG="${{ env.PROJECT_NAME }}-${{ inputs.environment }}-app"
          echo "Refreshing $ASG (pulls latest git + rebuilds compose including frontend)..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG" \
            --region "${{ env.AWS_REGION }}" \
            --preferences MinHealthyPercentage=100,InstanceWarmup=600,SkipMatching=false \
            --query InstanceRefreshId --output text)
          echo "InstanceRefreshId=$REFRESH_ID"
          echo "Watch: aws autoscaling describe-instance-refreshes --auto-scaling-group-name $ASG --region ${{ env.AWS_REGION }}"
