name: Terraform destroy (dev only)

# Manual tear-down of the DEV stack. Does not touch prod or global.
# Actions → Terraform destroy (dev only) → type confirm = destroy-dev
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly destroy-dev to proceed"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-1

jobs:
  destroy-dev:
    name: destroy · dev
    if: inputs.confirm == 'destroy-dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.4"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=popo-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Prepare tfvars
        working-directory: infra/environments/dev
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          APP_GIT_URL: ${{ vars.APP_GIT_URL }}
          ALLOWED_IP_CIDRS: ${{ vars.ALLOWED_IP_CIDRS }}
        run: |
          set -euo pipefail
          cp terraform.tfvars.example terraform.tfvars
          python3 <<'PY'
          import os, pathlib, re
          path = pathlib.Path("terraform.tfvars")
          text = path.read_text(encoding="utf-8")

          def set_str(key: str, value: str) -> None:
              global text
              if not value:
                  return
              if any(c in value for c in '"\\\n\r'):
                  raise SystemExit(f"refusing unsafe value for {key}")
              pat = re.compile(rf"^{re.escape(key)}\s*=\s*.*$", re.M)
              line = f'{key} = "{value}"'
              text = pat.sub(line, text, count=1) if pat.search(text) else text + f"\n{line}\n"

          def set_cidrs(raw: str) -> None:
              global text
              if not raw.strip():
                  return
              parts = [p.strip() for p in raw.split(",") if p.strip()]
              for p in parts:
                  if not re.fullmatch(r"\d{1,3}(\.\d{1,3}){3}/\d{1,2}", p):
                      raise SystemExit(f"invalid CIDR: {p}")
              rendered = "[" + ", ".join(f'"{p}"' for p in parts) + "]"
              pat = re.compile(r"^allowed_ip_cidrs\s*=\s*.*$", re.M)
              line = f"allowed_ip_cidrs = {rendered}"
              text = pat.sub(line, text, count=1) if pat.search(text) else text + f"\n{line}\n"

          set_str("alert_email", os.environ.get("ALERT_EMAIL", ""))
          set_str("domain_name", os.environ.get("DOMAIN_NAME", ""))
          set_str("app_git_url", os.environ.get("APP_GIT_URL", ""))
          set_cidrs(os.environ.get("ALLOWED_IP_CIDRS", ""))
          path.write_text(text, encoding="utf-8")
          PY

      - name: Terraform destroy
        working-directory: infra/environments/dev
        run: terraform destroy -input=false -auto-approve

  reject:
    name: rejected (bad confirm)
    if: inputs.confirm != 'destroy-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        run: |
          echo "Refusing destroy. You typed '${{ inputs.confirm }}' — must be exactly: destroy-dev"
          exit 1
