name: Deploy backend

# Auto on main (dev) when backend changes; manual for any env
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (manual only; push to main always deploys dev)"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: popo

jobs:
  deploy:
    name: backend → ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        working-directory: apps/backend
        run: docker build -t popo-backend:${{ github.sha }} .

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll ASG (zero-downtime refresh)
        run: |
          set -euo pipefail
          ASG="${{ env.PROJECT_NAME }}-${{ steps.env.outputs.name }}-app"
          echo "Target ASG=$ASG"

          # NEVER cancel an in-progress refresh — that terminates the old healthy
          # instance before the new one is ready and causes 502 downtime.
          # Wait for any active refresh, then start ours (latest code wins next).
          for i in $(seq 1 90); do
            CUR=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG" \
              --region "${{ env.AWS_REGION }}" \
              --max-records 1 \
              --query 'InstanceRefreshes[0].Status' --output text 2>/dev/null || echo "None")
            case "$CUR" in
              InProgress|Pending|Cancelling)
                echo "  wait $i: refresh still $CUR (preserving zero-downtime)"
                sleep 20
                ;;
              *)
                echo "  clear to start (last status=$CUR)"
                break
                ;;
            esac
          done

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG" \
            --region "${{ env.AWS_REGION }}" \
            --preferences MinHealthyPercentage=100,InstanceWarmup=900,SkipMatching=false \
            --query InstanceRefreshId --output text)
          echo "InstanceRefreshId=$REFRESH_ID"
